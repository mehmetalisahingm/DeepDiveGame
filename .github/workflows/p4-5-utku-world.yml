name: P4.5 Utku living world acceptance

on:
  push:
    branches: ['p45/utku-world-weather-current', 'codex/p4-integration']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p45-utku-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-world-2-process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require Unity CI credentials
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity CI licensing is not configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Build Linux integrated Unity game
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneLinux64
          buildMethod: DeepDive.Editor.P1IntegratedBuild.BuildLinux
          versioning: None
      - name: Normalize Linux executable
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Builds Logs 2>/dev/null || true
          mkdir -p Logs
          chmod +x ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Real 2-process seeded weather, visible buoy and current enter/exit
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 19277 -WorldConditions -Capture -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Real living-world rewards, roles, developments and disk restart
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 19377 -Living -Capture -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Real clip sponsor and single-payment regression
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 19477 -Acceptance -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Solo and four-process role effects
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 1 -Port 19577 -RoleEffects -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 4 -Port 19677 -RoleEffects -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Upload runtime JSON, logs and images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p45-world-${{ github.sha }}
          path: Logs/P1-integrated-*
          if-no-files-found: warn
          retention-days: 7
