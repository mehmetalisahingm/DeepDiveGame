name: Unity tests and Windows build

on:
  push:
    branches: [main, 'codex/p2-*', 'p2/*', 'codex/p3-*', 'p3/*', 'codex/p4-*', 'p4/*']
  pull_request:
    branches: [main, codex/p4-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require Unity CI credentials
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity CI licensing is not configured. See docs/CI.md. No Unity test/build has run.'
            echo 'Unity build BLOCKED: missing Unity credentials/license. Use the documented local build; this run is not PASS.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        with:
          unityVersion: 6000.3.23f1
          cliVersion: v0.1.72
          testMode: EditMode
          artifactsPath: Logs/CI-Tests
          githubToken: ''
      - name: Existing Windows build method
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: DeepDive.Editor.P1IntegratedBuild.BuildWindows
          versioning: None
      - name: Test reports
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-test-results-${{ github.sha }}
          path: Logs/CI-Tests/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  p43-runtime:
    name: P4.3 real 2-process fleet routes
    if: github.ref == 'refs/heads/p4/p44-final-acceptance' || github.ref == 'refs/heads/codex/p4-integration' || (github.event_name == 'pull_request' && github.head_ref == 'p4/p44-final-acceptance')
    needs: unity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require Unity CI credentials
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity CI licensing is not configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Build native Linux integrated player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneLinux64
          buildMethod: DeepDive.Editor.P1IntegratedBuild.BuildLinux
          versioning: None
      - name: Normalize Linux build permissions
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Builds Logs 2>/dev/null || true
          mkdir -p Logs
          chmod +x ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Prepare real purchased fleet campaign (2 processes)
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 18677 -Fleet -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
          $fleetRun = Get-ChildItem -LiteralPath ./Logs -Directory -Filter 'P1-integrated-*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $fleetRun) { throw 'Fleet smoke output bulunamadi' }
          $seed = Join-Path $fleetRun.FullName 'host.json.campaign.json'
          if (-not (Test-Path -LiteralPath $seed)) { throw "Fleet campaign bulunamadi: $seed" }
          "P43_FLEET_SEED=$seed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Motorboat reef full roundtrip (2 processes)
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 18777 -Trip -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64 -CampaignSeed $env:P43_FLEET_SEED -TripVehicle boat-2 -TripRoute route-reef-1
      - name: Research vessel deep full roundtrip (2 processes)
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P1-Integrated.ps1 -Players 2 -Port 18877 -Trip -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64 -CampaignSeed $env:P43_FLEET_SEED -TripVehicle boat-3 -TripRoute route-deep-1
      - name: Upload P4.3 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p43-runtime-${{ github.sha }}
          path: Logs/P1-integrated-*
          if-no-files-found: warn
          retention-days: 7


  p44-runtime:
    name: P4.4 real 2-process boss acceptance
    if: github.ref == 'refs/heads/p4/p44-final-acceptance' || github.ref == 'refs/heads/codex/p4-integration' || (github.event_name == 'pull_request' && github.head_ref == 'p4/p44-final-acceptance')
    needs: unity
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require Unity CI credentials
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity CI licensing is not configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Build native Linux integrated player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneLinux64
          buildMethod: DeepDive.Editor.P1IntegratedBuild.BuildLinux
          versioning: None
      - name: Normalize Linux build permissions
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Builds Logs 2>/dev/null || true
          mkdir -p Logs
          chmod +x ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64
      - name: Fixture-free progression, traces, arena, two-player boss and reload
        shell: pwsh
        run: |
          & xvfb-run -a pwsh -NoProfile -File ./tools/Test-P44-Boss-Acceptance.ps1 -BuildPath ./Builds/P1-Integrated/DeepDiveGame-P1.x86_64 -Port 18977
      - name: Upload P4.4 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p44-runtime-${{ github.sha }}
          path: Logs/P44-boss-*
          if-no-files-found: warn
          retention-days: 7
