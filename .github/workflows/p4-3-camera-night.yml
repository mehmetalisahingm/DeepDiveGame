name: P4.3 camera night capability smoke

on:
  push:
    branches: ['p4/utku-camera-capability']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-3-camera-night-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require Unity CI credentials
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity CI licensing is not configured.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: EditMode tests
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        with:
          unityVersion: 6000.3.23f1
          testMode: EditMode
          artifactsPath: Logs/CI-Tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate EditMode XML
        shell: python
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('Logs/CI-Tests/**/*.xml', recursive=True)
          if not files:
              print('No EditMode XML reports found')
              sys.exit(1)
          total = passed = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              if root.tag != 'test-run':
                  continue
              total += int(root.attrib.get('total', '0'))
              passed += int(root.attrib.get('passed', '0'))
              failed += int(root.attrib.get('failed', '0'))
              print(path, root.attrib.get('result'), root.attrib.get('total'), root.attrib.get('passed'), root.attrib.get('failed'))
          print(f'EditMode aggregate: total={total} passed={passed} failed={failed}')
          if total <= 0 or failed != 0 or passed <= 0:
              sys.exit(1)
      - name: Windows integrated build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: DeepDive.Editor.P1IntegratedBuild.BuildWindows
          versioning: None
      - name: Upload integrated Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-3-camera-night-windows-${{ github.sha }}
          path: Builds/P1-Integrated
          if-no-files-found: error
          retention-days: 2
      - name: Upload EditMode reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-3-camera-night-editmode-${{ github.sha }}
          path: Logs/CI-Tests/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  camera-night-smoke:
    needs: build-and-editmode
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
      - name: Download integrated Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-3-camera-night-windows-${{ github.sha }}
          path: Builds/P1-Integrated
      - name: Basic TooDark and Professional night recording smoke
        shell: pwsh
        run: ./tools/Test-P4-CameraNight.ps1 -Port 19063
      - name: Upload P4.3 camera night evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-3-camera-night-smoke-${{ github.sha }}
          path: Logs/P4-camera-night-*
          if-no-files-found: warn
          retention-days: 7
